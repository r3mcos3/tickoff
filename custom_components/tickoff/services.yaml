add_task:
  target:
    entity:
      integration: tickoff
      domain: todo
  fields:
    title: {required: true, example: "Pay the bill", selector: {text: {}}}
    notes: {selector: {text: {multiline: true}}}
    due_date: {selector: {date: {}}}
    due_time: {selector: {time: {}}}
    priority:
      selector:
        select:
          mode: dropdown
          options: [{value: "0", label: "None"}, {value: "1", label: "Low"}, {value: "2", label: "Medium"}, {value: "3", label: "High"}]
    tags: {example: "garden, weekend", selector: {text: {multiple: true}}}
    recurrence:
      example: '{"type": "weekly", "weekdays": [0, 3]}'
      selector: {object: {}}
    subtasks: {selector: {text: {multiple: true}}}
