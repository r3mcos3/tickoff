<!doctype html>
<html><head><meta charset="utf-8"><title>tickoff visual</title>
<style>
  :root { --primary-color:#03a9f4; --primary-text-color:#212121; --secondary-text-color:#727272; --card-background-color:#fff;
    --secondary-background-color:#f1f1f1; --divider-color:#e0e0e0; --text-primary-color:#fff; --error-color:#db4437; --warning-color:#f9a825;
    --primary-background-color:#fafafa; font-family: Roboto, "Segoe UI", sans-serif; }
  :root.dark { --primary-color:#03a9f4; --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --card-background-color:#1c1c1c;
    --secondary-background-color:#2b2b2b; --divider-color:#383838; --primary-background-color:#111; }
  body { margin:0; padding:16px; background: var(--primary-background-color); color: var(--primary-text-color); }
  ha-card { display:block; background: var(--card-background-color); border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  .wrap { max-width: 560px; margin: 0 auto; }
</style></head>
<body><div class="wrap" id="wrap"></div>
<script>
  // stand-in for Home Assistant's <ha-icon>: draws a short glyph so layout can be judged
  const G = {check:"✓", plus:"+", "tune-variant":"⚙", "calendar-clock":"◷", repeat:"↻", "alarm-snooze":"⏰", pencil:"✎", "delete-outline":"🗑",
    "chevron-right":"›", "chevron-down":"⌄", sort:"⇅", palette:"◐", tag:"#", flag:"⚑", calendar:"▦", "check-circle-outline":"✓", close:"×", "drag-vertical":"⋮", "cog-outline":"⚙"};
  customElements.define("ha-icon", class extends HTMLElement { connectedCallback(){ this.textContent = G[(this.getAttribute("icon")||"").slice(4)] || "•"; }
    static get observedAttributes(){return ["icon"];} attributeChangedCallback(){ if(this.isConnected) this.connectedCallback(); } });
  if (location.hash.includes("dark")) document.documentElement.classList.add("dark");
</script>
<script src="../../custom_components/tickoff/www/tickoff-card.js"></script>
<script src="visual.js"></script>
</body></html>
